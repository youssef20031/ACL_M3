name: ML backtest

# Rolling-origin backtest of points-model variants (scripts/analysis/ml_backtest.py): each
# variant is trained on earlier seasons and scored on 2023-24 .. the current season, including the
# 15-man squad the Team of the Week optimiser would pick each gameweek. Run it from the Actions tab
# before changing the model; it is too heavy for a laptop.
#
# Each variant's seeds run in jobs of up to 5 (a 20-seed reference is four jobs); the report job
# pools them with `score --pool` before reporting. Artifacts: report (report.md, res.json and
# res.gw.parquet, every per-gameweek table per seed) and chunk-* (each job's results and its
# row-level predictions, chunk_*.preds.parquet, which `score` can rescore without retraining).
on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Comma-separated variants (VARIANTS in scripts/analysis/ml_backtest.py)'
        default: 'current,previous'
      inseason:
        description: 'Seasons to replay with weekly retraining (blank to skip)'
        default: '2024-25,2025-26'
      ref:
        description: 'Variant the others are compared against'
        default: 'current'
      folds:
        description: 'Test seasons for the es/refit folds, comma-separated (blank for all)'
        default: ''
      seeds:
        description: 'Training seeds, e.g. 3,4,5 or 0-5 (blank for 0,1,2)'
        default: ''
      ref_seeds:
        description: 'Seeds for the reference variant only, e.g. 0-19 (blank: the same as seeds)'
        default: ''

env:
  VARIANTS: ${{ inputs.variants }}
  INSEASON: ${{ inputs.inseason }}
  REF: ${{ inputs.ref }}
  FOLDS: ${{ inputs.folds }}
  SEEDS: ${{ inputs.seeds }}
  REF_SEEDS: ${{ inputs.ref_seeds }}

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install pandas numpy xgboost-cpu scikit-learn httpx pyarrow
      - id: matrix
        run: python -m scripts.analysis.ml_backtest matrix --variants "$VARIANTS" --seeds "$SEEDS" --ref "$REF" --ref-seeds "$REF_SEEDS" >> "$GITHUB_OUTPUT"
      - name: Fetch the current season from the FPL API
        run: python -m pipeline.current_season --out-dir data/live || echo "::warning::live fetch failed; current-season fold skipped"
      # football-data.co.uk's files aren't committed (free for private use, not for redistribution).
      # Fetched only when a requested variant uses them (the odds* variants), so other runs don't
      # touch the site; a variant whose features come out empty fails in the run step.
      - name: Fetch bookmaker odds from football-data.co.uk
        if: contains(inputs.variants, 'odds')
        run: python -m scripts.data.fetch_odds || echo "::warning::odds fetch incomplete; see the odds coverage in the features step"
      - run: python -m scripts.analysis.ml_backtest features --out feats.pkl.gz
      - uses: actions/upload-artifact@v4
        with:
          name: feats
          path: feats.pkl.gz
          retention-days: 3

  run:
    needs: features
    name: run (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.features.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install pandas numpy xgboost-cpu scikit-learn httpx pyarrow
      - uses: actions/download-artifact@v4
        with:
          name: feats
      - run: python -m scripts.analysis.ml_backtest run --feats feats.pkl.gz --variants '${{ matrix.variant }}' --seeds '${{ matrix.seeds }}' --inseason "$INSEASON" ${FOLDS:+--folds "$FOLDS"} --out 'chunk_${{ matrix.tag }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.tag }}
          path: chunk_${{ matrix.tag }}.*
          retention-days: 14

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install pandas numpy xgboost-cpu scikit-learn pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
      # Merges each variant's seed chunks. Tables whose predictions are unchanged are reused, so only
      # the seed-averaged squads of variants split over several jobs are solved again.
      - run: python -m scripts.analysis.ml_backtest score 'chunk_*.preds.parquet' --pool --reuse --out res.json
      - run: python -m scripts.analysis.ml_backtest report res.json --ref "$REF" --out report.md
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.md
            res.json
            res.gw.parquet
          retention-days: 14
