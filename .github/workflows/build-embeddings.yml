name: Build & Commit Embeddings

# Triggers:
#   - Manual dispatch (choose which model to build)
#   - Automatic on push to main when the master CSV or embedding code changes
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model(s) to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - minilm
          - mpnet

  push:
    branches: [main]
    paths:
      - 'cleaned_merged_seasons_cleaned.csv'
      - 'embeddings/embedding_manager.py'
      - 'build_embeddings_from_csv.py'
      - 'preprocessing/merge_seasons.py'

jobs:
  build-embeddings:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the .pkl files back

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a PAT if you want the pushed commit to trigger other workflows,
          # otherwise the default GITHUB_TOKEN is fine.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install requirements (will pull default torch with CPU support)
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      # ── 4. Build embeddings from CSV (no Neo4j needed) ───────────────────
      - name: Build embeddings
        run: |
          MODEL="${{ github.event.inputs.model || 'both' }}"
          echo "Building model(s): $MODEL"
          python build_embeddings_from_csv.py "$MODEL"

      # ── 5. Upload as artifacts (always available for download) ───────────
      - name: Upload minilm artifact
        if: ${{ github.event.inputs.model == 'minilm' || github.event.inputs.model == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: minilm-embeddings
          path: embeddings/prebuilt/minilm_embeddings.pkl
          retention-days: 30

      - name: Upload mpnet artifact
        if: ${{ github.event.inputs.model == 'mpnet' || github.event.inputs.model == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: mpnet-embeddings
          path: embeddings/prebuilt/mpnet_embeddings.pkl
          retention-days: 30

      # ── 6. Commit the .pkl files back to the repo ─────────────────────────
      - name: Commit updated embeddings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add embeddings/prebuilt/minilm_embeddings.pkl \
                  embeddings/prebuilt/mpnet_embeddings.pkl

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No embedding changes detected — skipping commit."
          else
            MODEL="${{ github.event.inputs.model || 'both' }}"
            git commit -m "chore: rebuild prebuilt embeddings (model=$MODEL) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Embeddings committed and pushed."
          fi
