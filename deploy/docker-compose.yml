# Production stack for a single VM: Neo4j + FastAPI backend + Caddy (HTTPS,
# serves the built frontend and proxies the API). See deploy/README.md.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Variables come from deploy/.env (copy deploy/.env.example).
name: fpl

# Access logs include client IPs (see /privacy): keep only a few MB per service, rotated.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Don't add other NEO4J_* variables here: the image turns every NEO4J_* env var
      # into a config setting and refuses to start on unknown ones.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in deploy/.env}
      # Defaults fit a 4 GB VM (the graph itself is ~200 MB on disk; the backend
      # needs ~1 GB). Raise them in deploy/.env on bigger machines.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
    # Bound to localhost only: reach the Neo4j Browser through an SSH tunnel
    # (ssh -L 7474:localhost:7474 -L 7687:localhost:7687 ubuntu@<vm-ip>)
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Password is the part of NEO4J_AUTH after "neo4j/"
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      AVATAR_CACHE_PATH: /app/.cache/avatars.json
    volumes:
      - backend_cache:/app/.cache
      - live_data:/app/data/live   # current-season files from the daily pipeline
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # ML models and spaCy load at startup

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Absolute URLs in index.html (canonical, og:url/og:image), robots.txt and sitemap.xml.
        # Passed as-is: vite.config.ts takes the first address of a Caddy list and adds https://.
        SITE_URL: ${SITE_ADDRESS}
    restart: unless-stopped
    logging: *default-logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - caddy_data:/data      # TLS certificates — keep this volume
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
  backend_cache:
  live_data:
  caddy_data:
  caddy_config:
